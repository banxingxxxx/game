<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>事业编闯关刷题王</title>
<style>
:root{
  --bg1:#111827;
  --bg2:#1e3a8a;
  --card:rgba(255,255,255,.92);
  --ink:#152033;
  --muted:#6b7280;
  --blue:#2563eb;
  --gold:#f59e0b;
  --green:#16a34a;
  --red:#ef4444;
  --purple:#7c3aed;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  min-height:100vh;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,.26), transparent 24%),
    radial-gradient(circle at 80% 0%, rgba(251,191,36,.28), transparent 28%),
    linear-gradient(145deg,#111827 0%,#1e3a8a 45%,#4c1d95 100%);
  overflow-x:hidden;
}
.stars{
  position:fixed;inset:0;pointer-events:none;opacity:.75;
  background-image:
    radial-gradient(circle,#fff 1px,transparent 1.5px),
    radial-gradient(circle,#fff 1px,transparent 1.5px);
  background-size:42px 42px,68px 68px;
  background-position:0 0,20px 24px;
}
.wrap{width:min(980px,100%);margin:0 auto;padding:14px;position:relative}
.hero{
  color:white;
  padding:18px 8px 10px;
  text-align:center;
}
.hero h1{
  margin:4px 0 8px;
  font-size:clamp(28px,7vw,48px);
  letter-spacing:.04em;
  text-shadow:0 5px 18px rgba(0,0,0,.35);
}
.hero p{margin:0 auto;max-width:760px;line-height:1.7;color:#dbeafe;font-size:15px}
.game{
  background:var(--card);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:0 24px 60px rgba(0,0,0,.28);
  border-radius:28px;
  padding:16px;
  overflow:hidden;
}
.topbar{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}
.stat{
  background:linear-gradient(180deg,#fff,#eef4ff);
  border:1px solid #dbeafe;
  border-radius:18px;
  padding:10px 8px;
  text-align:center;
}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.hearts{font-size:20px;letter-spacing:2px;white-space:nowrap}
.map{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:9px;
  padding:10px;
  background:linear-gradient(180deg,#eff6ff,#f8fafc);
  border-radius:20px;
  border:1px solid #dbeafe;
  margin-bottom:14px;
}
.node{
  min-height:54px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-weight:800;
  color:#64748b;
  background:#e5e7eb;
  border:2px solid transparent;
  position:relative;
}
.node small{font-size:10px;font-weight:600}
.node.done{
  background:linear-gradient(135deg,#bbf7d0,#86efac);
  color:#14532d;
}
.node.current{
  color:white;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  box-shadow:0 10px 22px rgba(37,99,235,.35);
  transform:translateY(-2px);
}
.node.boss{
  background:linear-gradient(135deg,#fbbf24,#f97316);
  color:#fff7ed;
}
.question-card{
  background:#fff;
  border-radius:24px;
  padding:18px;
  box-shadow:inset 0 0 0 1px #e5e7eb;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#eef2ff;
  color:#3730a3;
  border-radius:999px;
  padding:7px 12px;
  font-weight:800;
  font-size:13px;
}
.q{
  font-size:clamp(18px,4.7vw,24px);
  line-height:1.55;
  margin:14px 0 12px;
  font-weight:900;
}
.options{display:grid;gap:10px}
.opt{
  width:100%;
  border:2px solid #e5e7eb;
  background:linear-gradient(180deg,#ffffff,#f8fafc);
  border-radius:18px;
  padding:14px 14px;
  font-size:16px;
  text-align:left;
  color:var(--ink);
  cursor:pointer;
  display:flex;
  gap:10px;
  align-items:flex-start;
  transition:.14s transform,.14s border,.14s background;
}
.opt:hover{transform:translateY(-1px);border-color:#93c5fd}
.letter{
  flex:0 0 auto;
  width:28px;height:28px;
  border-radius:10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#dbeafe;
  color:#1d4ed8;
  font-weight:900;
}
.opt.correct{
  border-color:#22c55e;
  background:linear-gradient(180deg,#dcfce7,#f0fdf4);
}
.opt.correct .letter{background:#22c55e;color:white}
.opt.wrong{
  border-color:#ef4444;
  background:linear-gradient(180deg,#fee2e2,#fff7f7);
}
.opt.wrong .letter{background:#ef4444;color:white}
.feedback{
  margin-top:12px;
  display:none;
  border-radius:18px;
  padding:13px;
  line-height:1.65;
}
.feedback.good{display:block;background:#ecfdf5;border:1px solid #86efac}
.feedback.bad{display:block;background:#fff1f2;border:1px solid #fca5a5}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:13px;
}
button.main,button.ghost{
  border:0;border-radius:16px;padding:13px 16px;font-size:16px;font-weight:900;cursor:pointer;
}
button.main{
  color:white;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  box-shadow:0 12px 22px rgba(37,99,235,.28);
}
button.ghost{
  color:#1e3a8a;
  background:#dbeafe;
}
.start{
  text-align:center;
  padding:18px 8px 22px;
}
.start .big{
  font-size:68px;
  margin:8px 0;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.18));
}
.rules{
  text-align:left;
  max-width:680px;
  margin:14px auto;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:20px;
  padding:14px;
  line-height:1.7;
}
.result{
  text-align:center;
  padding:18px;
}
.rank{
  font-size:30px;
  font-weight:1000;
  margin:8px 0;
}
.trophy{font-size:72px}
.shake{animation:shake .25s linear}
.pop{animation:pop .24s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}
@keyframes pop{
  0%{transform:scale(.96)}
  70%{transform:scale(1.03)}
  100%{transform:scale(1)}
}
@media(max-width:560px){
  .wrap{padding:10px}
  .game{border-radius:22px;padding:12px}
  .topbar{grid-template-columns:1fr 1fr;gap:8px}
  .topbar .stat:last-child{grid-column:1/3}
  .map{grid-template-columns:repeat(3,1fr)}
  .node{min-height:48px;border-radius:15px}
  .question-card{padding:14px;border-radius:20px}
}
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">
  <div class="hero">
    <h1>事业编闯关刷题王</h1>
    <p>赢了加积分，输了扣血量。15关通关，最后按分数给你评级。题目按事业编职测常见模块设计：常识、言语、判断、数量、资料分析、综合应用。</p>
  </div>

  <div class="game" id="app"></div>
</div>

<script>
const bank = [
 {type:"常识判断", q:"事业单位公开招聘考试中，公共科目通常更侧重考查的是：", opts:["只考专业课知识","岗位所需基本能力和综合应用能力","只考背诵能力","所有岗位考试内容完全一样"], ans:1, exp:"事业编公共科目常围绕岗位所需基本素质、职业能力和综合应用能力来考查。"},
 {type:"言语理解", q:"填入最恰当的一项：真正有效的复习，不是机械刷题，而是把错题背后的规律____出来。", opts:["隐藏","提炼","丢弃","拖延"], ans:1, exp:"“提炼规律”搭配最自然，表示从错题中总结方法。"},
 {type:"判断推理", q:"所有认真备考的人都会整理错题。小李没有整理错题。由此一定推出：", opts:["小李没有做题","小李不是认真备考的人","小李一定不会上岸","整理错题的人都认真备考"], ans:1, exp:"认真备考→整理错题；没有整理错题→不是认真备考，这是逆否推理。"},
 {type:"数量关系", q:"某人第一天做20题，以后每天比前一天多5题，第6天做多少题？", opts:["40","45","50","55"], ans:1, exp:"等差数列：20+(6-1)×5=45。"},
 {type:"资料分析", q:"报名人数从800人增加到1000人，增长率是：", opts:["20%","25%","30%","40%"], ans:1, exp:"增长率=(1000-800)/800=25%。"},
 {type:"常识判断", q:"下列行为更符合事业单位工作人员职业要求的是：", opts:["遇到问题先推责","依法依规履职，服务公共利益","随意泄露工作信息","只追求个人方便"], ans:1, exp:"事业单位岗位强调规范履职、公共服务意识和责任意识。"},
 {type:"言语理解", q:"下列句子没有语病的一项是：", opts:["通过训练，使我掌握了方法。","他的成绩提高得很快。","我们要避免不再犯同样错误。","这个计划大约三天左右完成。"], ans:1, exp:"A缺主语，C否定不当，D“大约”和“左右”重复。"},
 {type:"判断推理", q:"书籍 对于 阅读，相当于 跑鞋 对于：", opts:["运动","鞋带","商店","颜色"], ans:0, exp:"书籍用于阅读，跑鞋用于运动，是功能对应关系。"},
 {type:"数量关系", q:"甲乙合作6天完成，甲单独10天完成。乙单独完成需要：", opts:["12天","15天","18天","20天"], ans:1, exp:"乙效率=1/6-1/10=1/15，所以乙单独15天。"},
 {type:"资料分析", q:"某单位男员工30人，女员工20人，女员工占总人数的：", opts:["30%","40%","50%","60%"], ans:1, exp:"总人数50，女员工20，占20/50=40%。"},
 {type:"综合应用", q:"群众反映办事窗口排队时间长，较合理的处理思路是：", opts:["直接说无法解决","先了解高峰时段和流程，再优化办理方案","让群众少来","只写报告不调查"], ans:1, exp:"综合应用题看重发现问题、分析原因、提出可执行方案。"},
 {type:"判断推理", q:"如果“有些A是B”为真，则一定为真的是：", opts:["所有A都是B","有些B是A","所有B都是A","有些A不是B"], ans:1, exp:"“有些A是B”可以换位为“有些B是A”。"},
 {type:"数量关系", q:"一件商品原价200元，打八折后售价为：", opts:["120元","140元","160元","180元"], ans:2, exp:"八折就是80%，200×0.8=160。"},
 {type:"资料分析", q:"去年录取120人，今年录取150人，今年比去年多录取：", opts:["20人","25人","30人","35人"], ans:2, exp:"150-120=30人。先看清楚问的是数量还是比例。"},
 {type:"终极Boss", q:"做资料分析题时，最稳的顺序通常是：", opts:["先看全文，再看题","先看问题，定位材料，再计算","直接估答案","先背选项"], ans:1, exp:"资料分析要先明确问题，再定位数据，最后计算或估算。"}
];

let index=0, hp=5, score=0, combo=0, answered=false;
const app=document.getElementById("app");

function hearts(){
  let s="";
  for(let i=0;i<5;i++) s += i<hp ? "❤️" : "🖤";
  return s;
}
function renderStart(){
  app.innerHTML=`
    <div class="start">
      <div class="big">🏯</div>
      <h2>准备进入事业编试炼塔</h2>
      <div class="rules">
        <b>玩法：</b><br>
        答对：+10积分，连击额外加分。<br>
        答错：扣1点血量，并显示解析。<br>
        血量归零：闯关失败。<br>
        第15关是Boss题，答对额外+20积分。
      </div>
      <div class="actions" style="justify-content:center">
        <button class="main" onclick="startGame()">开始闯关</button>
        <button class="ghost" onclick="shuffleBank()">随机题序</button>
      </div>
    </div>`;
}
function shuffleBank(){
  for(let i=bank.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [bank[i],bank[j]]=[bank[j],bank[i]];
  }
  renderStart();
}
function startGame(){
  index=0; hp=5; score=0; combo=0; answered=false;
  renderQuestion();
}
function mapHtml(){
  return `<div class="map">` + bank.map((_,i)=>{
    let cls="node";
    if(i<index) cls+=" done";
    if(i===index) cls+=" current";
    if(i===bank.length-1) cls+=" boss";
    return `<div class="${cls}"><div>${i===bank.length-1?"👑":i+1}</div><small>${i<index?"已过":i===index?"当前":"待战"}</small></div>`;
  }).join("") + `</div>`;
}
function topHtml(){
  return `<div class="topbar">
    <div class="stat"><b>${score}</b><span>积分</span></div>
    <div class="stat"><b>${combo}</b><span>连击</span></div>
    <div class="stat"><b class="hearts">${hearts()}</b><span>血量</span></div>
  </div>`;
}
function renderQuestion(){
  answered=false;
  const item=bank[index];
  app.innerHTML=`
    ${topHtml()}
    ${mapHtml()}
    <div class="question-card" id="qcard">
      <span class="badge">⚔️ 第 ${index+1} 关｜${item.type}</span>
      <div class="q">${item.q}</div>
      <div class="options" id="options">
        ${item.opts.map((o,i)=>`<button class="opt" onclick="choose(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join("")}
      </div>
      <div id="fb" class="feedback"></div>
      <div class="actions" id="actions"></div>
    </div>`;
}
function choose(i){
  if(answered)return;
  answered=true;
  const item=bank[index];
  const buttons=[...document.querySelectorAll(".opt")];
  buttons.forEach((b,k)=>{
    b.disabled=true;
    if(k===item.ans)b.classList.add("correct");
    if(k===i && i!==item.ans)b.classList.add("wrong");
  });
  const fb=document.getElementById("fb");
  const card=document.getElementById("qcard");
  let gain=0;
  if(i===item.ans){
    combo++;
    gain=10 + Math.min(combo-1,5)*2;
    if(index===bank.length-1) gain+=20;
    score+=gain;
    fb.className="feedback good pop";
    fb.innerHTML=`✅ <b>答对了！</b> 本题获得 ${gain} 分。<br>正确答案：${String.fromCharCode(65+item.ans)}。<br>${item.exp}`;
    card.classList.add("pop");
  }else{
    hp--;
    combo=0;
    fb.className="feedback bad shake";
    fb.innerHTML=`❌ <b>答错了，扣1点血量。</b><br>正确答案：${String.fromCharCode(65+item.ans)}。<br>${item.exp}`;
    card.classList.add("shake");
  }
  document.querySelector(".topbar").outerHTML=topHtml();
  const actions=document.getElementById("actions");
  if(hp<=0){
    actions.innerHTML=`<button class="main" onclick="finish(false)">查看结果</button><button class="ghost" onclick="startGame()">重新挑战</button>`;
  }else if(index>=bank.length-1){
    actions.innerHTML=`<button class="main" onclick="finish(true)">领取通关奖励</button><button class="ghost" onclick="startGame()">重新挑战</button>`;
  }else{
    actions.innerHTML=`<button class="main" onclick="next()">下一关</button>`;
  }
}
function next(){index++;renderQuestion();}
function finish(win){
  let rank="青铜备考生", tip="先别追求速度，先把错题规律弄懂。";
  if(score>=170){rank="王者上岸苗子";tip="准确率很强，继续练限时和资料分析速度。";}
  else if(score>=135){rank="钻石刷题手";tip="基础不错，把判断推理和资料分析稳定住。";}
  else if(score>=100){rank="黄金进步王";tip="已经入门，但要减少低级失误。";}
  else if(score>=70){rank="白银冲刺者";tip="先补常见题型，不要盲目刷难题。";}
  app.innerHTML=`
    <div class="result">
      <div class="trophy">${win?"🏆":"💀"}</div>
      <h2>${win?"通关成功！":"闯关失败"}</h2>
      <div class="rank">${rank}</div>
      <p class="score">最终积分：${score}</p>
      <p>剩余血量：${hearts()}</p>
      <div class="rules">
        <b>建议：</b><br>${tip}<br><br>
        真正提分的关键不是“猜答案”，而是每做错一题都要知道：错在概念、计算、审题，还是逻辑翻译。
      </div>
      <div class="actions" style="justify-content:center">
        <button class="main" onclick="startGame()">再闯一次</button>
        <button class="ghost" onclick="shuffleBank()">随机挑战</button>
      </div>
    </div>`;
}
renderStart();
</script>
</body>
</html>
