:#fff;box-shadow:0 12px 24px rgba(37,99,235,.30)}button.ghost{background:#dbeafe;color:#1e3a8a}.start{text-align:center;padding:18px 4px}.big{font-size:72px;filter:drop-shadow(0 8px 15px rgba(0,0,0,.24))}.rules{text-align:left;margin:14px auto;background:#f8fafc;border:1px solid #e5e7eb;border-radius:20px;max-width:760px;padding:14px;line-height:1.72}.selectGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:360px;overflow:auto;padding:6px}.selectGrid button{min-height:44px;border:0;border-radius:13px;background:#eef2ff;color:#27316b;font-weight:900}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:20;opacity:0;pointer-events:none;transition:.18s;filter:drop-shadow(0 22px 45px rgba(0,0,0,.45))}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.toastBox{width:min(82vw,320px);border-radius:28px;overflow:hidden;background:#fff;border:5px solid rgba(255,255,255,.8)}.toastBox img{display:block;width:100%;max-height:360px;object-fit:cover}.toastText{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;padding:10px 18px;border-radius:999px;font-weight:1000;white-space:nowrap;box-shadow:0 10px 20px rgba(0,0,0,.25)}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:19}.confetti i{position:absolute;width:8px;height:14px;background:var(--gold);top:-30px;animation:fall 1.1s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(460deg);opacity:.2}}.shake{animation:shake .25s linear}.pop{animation:pop .22s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes pop{0%{transform:scale(.97)}70%{transform:scale(1.025)}100%{transform:scale(1)}}.footerNote{font-size:12px;color:#e5e7eb;text-align:center;margin:10px 0 0;line-height:1.6}@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.levels{grid-template-columns:repeat(4,1fr)}.selectGrid{grid-template-columns:repeat(4,1fr)}.panel{border-radius:22px;padding:10px}.card{border-radius:20px;padding:13px}}

function seedRand(n){let x=Math.sin(n*999+7)*10000;return x-Math.floor(x)}function shuffle(arr,seed){let a=arr.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(seedRand(seed+i*13)*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pack(correct,wrongs,seed){let items=[{text:String(correct),right:true}].concat(wrongs.map(w=>({text:String(w),right:false})));let s=shuffle(items,seed);return{opts:s.map(x=>x.text),ans:s.findIndex(x=>x.right)}}function pct(n){return (Math.round(n*1000)/10).toFixed(1).replace('.0','')+'%'}
function build(type,q,material,correct,wrongs,exp,id){let w=[...new Set(wrongs.map(String))].filter(x=>x!==String(correct));while(w.length<3)w.push(String(correct)+' ');let p=pack(correct,w.slice(0,3),id*31+17);return{id,type,q,material,opts:p.opts,ans:p.ans,exp}}
function makeMath(id){let t=id%8,a,b,c,correct,wrongs,exp,q;if(t===0){a=12+id%37;b=3+id%8;c=2+id%6;correct=a+(b-1)*c;q=`某同学第一天做${a}题，以后每天比前一天多${c}题，第${b}天做多少题？`;wrongs=[correct+c,correct-c,a+b+c];exp=`等差数列第n项=首项+(n-1)×公差，所以为${a}+(${b}-1)×${c}=${correct}。`}else if(t===1){a=80+(id%30)*5;b=[6,7,8,9][id%4];correct=Math.round(a*b/10);q=`一件商品原价${a}元，打${b}折后售价为多少元？`;wrongs=[a-b,Math.round(a*(10-b)/10),correct+10];exp=`${b}折表示原价的${b}0%，售价=${a}×${b}/10=${correct}元。`}else if(t===2){a=4+id%7;b=6+id%9;correct=a*b;q=`甲每小时做${b}个零件，连续工作${a}小时，一共做多少个零件？`;wrongs=[a+b,a*b+b,a*b-a];exp=`工作总量=效率×时间=${b}×${a}=${correct}。`}else if(t===3){a=120+(id%20)*10;b=20+(id%5)*5;correct=a+b;q=`某单位男员工${a}人，女员工${b}人，总人数是多少？`;wrongs=[a-b,a,b];exp=`总人数=男员工人数+女员工人数=${a}+${b}=${correct}。`}else if(t===4){a=30+id%40;b=2+id%5;correct=a*b;q=`某车每小时行驶${a}千米，行驶${b}小时，共行驶多少千米？`;wrongs=[a+b,a*b+b,a*(b+1)];exp=`路程=速度×时间=${a}×${b}=${correct}千米。`}else if(t===5){a=48+(id%12)*6;b=3+id%6;correct=a/b;q=`把${a}本书平均分给${b}个班，每个班分到多少本？`;wrongs=[correct+b,correct-1,correct*2];exp=`平均数=总量÷份数=${a}÷${b}=${correct}。`}else if(t===6){a=5+id%8;b=3+id%7;correct=a*a+b*b;q=`计算：${a}² + ${b}² = ?`;wrongs=[a*a+b,a+b*b,correct+2];exp=`${a}²=${a*a}，${b}²=${b*b}，相加为${correct}。`}else{a=50+(id%20)*5;b=10+(id%9)*2;correct=a-b;q=`一筐苹果有${a}个，卖出${b}个后，还剩多少个？`;wrongs=[a+b,b,a-b+5];exp=`剩余数量=原有数量-卖出数量=${a}-${b}=${correct}。`}return build('数量关系',q,'',correct,wrongs,exp,id)}
function makeData(id){let base=200+(id%30)*20,add=20+(id%8)*10,now=base+add,t=id%5,q,correct,wrongs,exp,m=`某地考试报名统计：去年报名${base}人，今年报名${now}人；其中男生${Math.floor(now*.55)}人，女生${now-Math.floor(now*.55)}人。`;if(t===0){correct=add;q='今年报名人数比去年增加多少人？';wrongs=[now,base,add+10];exp=`增加量=今年-去年=${now}-${base}=${add}人。`}else if(t===1){correct=pct(add/base);q='今年报名人数比去年增长约多少？';wrongs=[pct(add/now),pct(base/now),pct((add+20)/base)];exp=`增长率=增长量÷基期量=${add}÷${base}≈${correct}。`}else if(t===2){let male=Math.floor(now*.55);correct=male;q='今年男生报名人数是多少？';wrongs=[now-male,now,male+10];exp=`材料直接给出男生人数为${male}人。`}else if(t===3){let male=Math.floor(now*.55),female=now-male;correct=female;q='今年女生报名人数是多少？';wrongs=[male,now,female+10];exp=`女生人数=总人数-男生人数=${now}-${male}=${female}人。`}else{correct=pct(Math.floor(now*.55)/now);q='今年男生约占总报名人数的多少？';wrongs=['45%','50%','60%'];exp=`男生占比=男生人数÷总人数，约为${correct}。`}return build('资料分析',q,m,correct,wrongs,exp,id)}
function makeLogic(id){let t=id%8,q,correct,wrongs,exp;if(t===0){q='所有认真复盘的人都会整理错题。小王没有整理错题。由此一定能推出：';correct='小王不是认真复盘的人';wrongs=['小王没有做题','小王一定考试失败','整理错题的人都认真复盘'];exp='认真复盘→整理错题；否定后件可推出否定前件。'}else if(t===1){q='书籍 对于 阅读，相当于 跑鞋 对于：';correct='运动';wrongs=['鞋带','商店','颜色'];exp='书籍的主要用途是阅读，跑鞋的主要用途是运动。'}else if(t===2){q='如果“有些A是B”为真，则一定为真的是：';correct='有些B是A';wrongs=['所有A都是B','所有B都是A','有些A不是B'];exp='“有些A是B”可以换位为“有些B是A”。'}else if(t===3){let a=2+id%5,b=3+id%6,c=4+id%7;q=`观察数列：${a}，${a+b}，${a+b+c}，后一项与前一项的差依次增大。下一项最可能是？`;correct=a+b+c+(c+1);wrongs=[a+b+c+c,a+b+c+1,a+b+c+b];exp=`相邻差为${b}、${c}，按差值继续增加1，下一差为${c+1}，所以答案为${correct}。`}else if(t===4){q='医生：医院 与 教师：____ 的关系最相近。';correct='学校';wrongs=['课本','粉笔','考试'];exp='医生在医院工作，教师在学校工作，是职业与工作场所关系。'}else if(t===5){q='若“只要下雨，地面就会湿”。现在地面没有湿，可以推出：';correct='没有下雨';wrongs=['一定下雨了','地面一定很干净','下雨和地面无关'];exp='下雨→地面湿；地面不湿→没有下雨，属于逆否推理。'}else if(t===6){q='苹果：水果 与 钢笔：____ 的关系最相近。';correct='文具';wrongs=['墨水','纸张','颜色'];exp='苹果属于水果，钢笔属于文具，都是种属关系。'}else{q='甲、乙、丙三人排队。甲在乙前面，乙在丙前面。可以确定：';correct='甲在丙前面';wrongs=['丙在甲前面','乙在甲前面','三人位置无法判断'];exp='甲在乙前，乙在丙前，所以顺序为甲、乙、丙。'}return build('判断推理',q,'',correct,wrongs,exp,id)}
function makeVerbal(id){let v=verbal[id%verbal.length];return build('言语理解',v[0],'',v[1],v[2],v[3],id)}function makeCommon(id){let c=common[id%common.length];return build('常识判断',c[0],'',c[1],c[2],c[3],id)}function getQuestion(globalIndex){let id=globalIndex+1,mode=globalIndex%5;if(mode===0)return makeMath(id);if(mode===1)return makeData(id);if(mode===2)return makeLogic(id);if(mode===3)return makeVerbal(id);return makeCommon(id)}
function hearts(){return Array.from({length:3},(_,i)=>i<state.hp?'❤️':'🖤').join('')}function saveBest(){if(state.score>state.best){state.best=state.score;localStorage.setItem('xingce_best',String(state.best))}}function renderStart(){app.innerHTML=`<div class="start"><div class="big">🏆</div><h2>行测千题试炼塔</h2><div class="rules"><b>游戏规则</b><br>1. 共1000道题，50关，每关20道题。<br>2. 每关生命值3点，答错1题扣1点，生命归零本关失败。<br>3. 答对+10分，连击有额外积分，答对会弹出你上传图片中的随机奖励图。<br>4. 答错会显示详细解析。<br>5. 题型覆盖：数量关系、资料分析、判断推理、言语理解、常识判断。</div><div class="actions"><button class="main" onclick="startLevel(1)">从第1关开始</button><button class="ghost" onclick="renderLevelSelect()">选择关卡</button></div></div>`}function renderLevelSelect(){app.innerHTML=`<div class="card"><span class="badge">🗺️ 选择关卡</span><div class="q">共50关，每关20题。你要从哪一关开始？</div><div class="selectGrid">${Array.from({length:TOTAL_LEVELS},(_,i)=>`<button onclick="startLevel(${i+1})">第${i+1}关</button>`).join('')}</div><div class="actions"><button class="ghost" onclick="renderStart()">返回首页</button></div></div>`}function startLevel(lv){state.level=lv;state.pos=0;state.hp=3;state.combo=0;state.answered=false;renderQ()}function topHtml(){return `<div class="stats"><div class="stat"><b>${state.score}</b><span>积分</span></div><div class="stat"><b>${state.combo}</b><span>连击</span></div><div class="stat"><b class="hearts">${hearts()}</b><span>本关生命</span></div><div class="stat"><b>${state.best}</b><span>历史最高</span></div></div>`}function mapHtml(){let start=Math.max(1,Math.min(state.level-2,TOTAL_LEVELS-4));let arr=Array.from({length:5},(_,i)=>start+i).filter(x=>x>=1&&x<=TOTAL_LEVELS);return `<div class="levels">${arr.map(l=>{let cls='level'+(l<state.level?' pass':'')+(l===state.level?' current':'')+(l%10===0?' boss':'');return `<button class="${cls}" onclick="startLevel(${l})"><span>${l%10===0?'👑':l}</span><small>${l===state.level?'当前':l<state.level?'已过':'关卡'}</small></button>`}).join('')}</div>`}function renderQ(){state.answered=false;let globalIndex=(state.level-1)*Q_PER_LEVEL+state.pos;state.current=getQuestion(globalIndex);let q=state.current;app.innerHTML=`${topHtml()}${mapHtml()}<div class="card" id="qCard"><span class="badge">⚔️ 第${state.level}关 · 第${state.pos+1}/20题 · ${q.type} · 题库${globalIndex+1}/1000</span>${q.material?`<div class="material">${q.material}</div>`:''}<div class="q">${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="choose(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}</div><div id="fb" class="feedback"></div><div id="actions" class="actions"></div></div>`}
function choose(i){if(state.answered)return;state.answered=true;let q=state.current;let buttons=[...document.querySelectorAll('.opt')];buttons.forEach((b,k)=>{b.disabled=true;if(k===q.ans)b.classList.add('correct');if(k===i&&i!==q.ans)b.classList.add('wrong')});let fb=document.getElementById('fb'),card=document.getElementById('qCard');if(i===q.ans){state.combo++;let gain=10+Math.min(10,state.combo-1)*2+(state.pos===19?10:0);state.score+=gain;saveBest();fb.className='feedback show good pop';fb.innerHTML=`✅ <b>答对了！</b> 获得${gain}积分。<br>正确答案：${String.fromCharCode(65+q.ans)}。<br>${q.exp}`;card.classList.add('pop');reward(gain)}else{state.hp--;state.combo=0;fb.className='feedback show bad shake';fb.innerHTML=`❌ <b>答错了，扣1点生命。</b><br>正确答案：${String.fromCharCode(65+q.ans)}。<br><b>解析：</b>${q.exp}`;card.classList.add('shake')}document.querySelector('.stats').outerHTML=topHtml();let actions=document.getElementById('actions');if(state.hp<=0){actions.innerHTML=`<button class="main" onclick="levelFail()">本关失败，查看结果</button><button class="ghost" onclick="startLevel(${state.level})">重挑战本关</button>`}else if(state.pos>=Q_PER_LEVEL-1){actions.innerHTML=`<button class="main" onclick="levelPass()">通过本关</button><button class="ghost" onclick="startLevel(${state.level})">重刷本关</button>`}else{actions.innerHTML='<button class="main" onclick="state.pos++;renderQ()">下一题</button>'}}
function levelPass(){let next=state.level+1;app.innerHTML=`${topHtml()}<div class="card start"><div class="big">🎉</div><h2>第${state.level}关通关！</h2><div class="rules">本关完成。当前积分：<b>${state.score}</b>。下一关继续保持，别让粗心偷走分数。</div><div class="actions">${next<=TOTAL_LEVELS?`<button class="main" onclick="startLevel(${next})">进入第${next}关</button>`:`<button class="main" onclick="finalWin()">查看总成绩</button>`}<button class="ghost" onclick="renderLevelSelect()">选择其他关</button></div></div>`}function levelFail(){app.innerHTML=`${topHtml()}<div class="card start"><div class="big">🛡️</div><h2>第${state.level}关失败</h2><div class="rules">生命值归零。建议重刷本关，把错题解析看懂再继续。行测提分靠稳定，不靠蒙。</div><div class="actions"><button class="main" onclick="startLevel(${state.level})">重新挑战本关</button><button class="ghost" onclick="renderLevelSelect()">选择关卡</button></div></div>`}function finalWin(){app.innerHTML=`<div class="card start"><div class="big">👑</div><h2>千题通关完成</h2><div class="rules">最终积分：<b>${state.score}</b><br>你已经完成1000题训练。下一步应该按错因分类：审题错、计算错、逻辑错、知识点不会。</div><div class="actions"><button class="main" onclick="state.score=0;startLevel(1)">重新开始</button></div></div>`}
function reward(gain){playSound();confetti();if(!USER_IMAGES.length)return;let img=USER_IMAGES[Math.floor(seedRand(Date.now()+state.score)*USER_IMAGES.length)];document.getElementById('toastImg').src=img;document.querySelector('.toastText').textContent=`答对了！积分+${gain}`;let t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),900)}function playSound(){try{const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();[523,659,784].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.0001,ctx.currentTime+i*.08);g.gain.exponentialRampToValueAtTime(.08,ctx.currentTime+i*.08+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.08+.12);o.start(ctx.currentTime+i*.08);o.stop(ctx.currentTime+i*.08+.14)})}catch(e){}}function confetti(){let c=document.getElementById('confetti');for(let i=0;i<26;i++){let el=document.createElement('i');el.style.left=(Math.random()*100)+'vw';el.style.background=['#f59e0b','#22c55e','#38bdf8','#fb7185','#a78bfa'][i%5];el.style.animationDelay=(Math.random()*.2)+'s';el.style.transform=`rotate(${Math.random()*180}deg)`;c.appendChild(el);setTimeout(()=>el.remove(),1300)}}renderStart();
</script></body></html>
