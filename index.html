ents:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.toastBox{border-radius:28px;background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;padding:26px 32px;font-weight:1000;font-size:24px;box-shadow:0 22px 45px rgba(0,0,0,.35)}@media(max-width:720px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.panel{border-radius:22px;padding:10px}.card{border-radius:19px}.hero{padding-top:10px}}

<div class="wrap"><div class="hero"><h1>骚凤1000题 · 稳定联网PK版</h1><p>这个版本不依赖外部 JS，使用 Supabase REST 轮询同步，手机更容易打开。创建房间 → 分享房间码 → 双人PK。</p></div><div class="panel" id="app"><div class="card">正在加载游戏……</div></div></div>
<div class="toast" id="toast"><div class="toastBox" id="toastText">答对了！</div></div>
<script>
var SUPABASE_URL='https://pfehmdhqkffofpmlpgjv.supabase.co';
var SUPABASE_KEY='sb_publishable_-kSaNb2TL73MiM6WMovqeg_67B61U6b';
var REST=SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/battle_rooms';
var app=document.getElementById('app');
var pollTimer=null, advanceTimer=null;
var clientId=localStorage.getItem('saofeng_pk_id');
if(!clientId){clientId='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);localStorage.setItem('saofeng_pk_id',clientId)}
var state={room:null,role:null,answered:false,currentQ:null};
function headers(extra){var h={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};if(extra){for(var k in extra)h[k]=extra[k]}return h}
function showError(msg){app.innerHTML='<div class="card"><span class="badge">⚠️ 出错了</span><p>'+escapeHtml(msg)+'</p><button class="main" onclick="renderHome()">返回首页</button></div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
async function apiGetRoom(id){var r=await fetch(REST+'?id=eq.'+encodeURIComponent(id)+'&select=*',{headers:headers()});if(!r.ok)throw new Error(await r.text());var a=await r.json();return a&&a[0]}
async function apiInsert(obj){var r=await fetch(REST,{method:'POST',headers:headers({'Prefer':'return=representation'}),body:JSON.stringify(obj)});if(!r.ok)throw new Error(await r.text());var a=await r.json();return a[0]}
async function apiPatch(id,obj){var r=await fetch(REST+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:headers({'Prefer':'return=representation'}),body:JSON.stringify(obj)});if(!r.ok)throw new Error(await r.text());var a=await r.json();return a[0]}
function seedRand(n){var x=Math.sin(n*999+7)*10000;return x-Math.floor(x)}
function pick(arr,n){return arr[Math.abs(n)%arr.length]}
function shuffle(arr,seed){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(seedRand(seed+i*17)*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function makeOptions(correct,wrongs,seed){var c=String(correct);var seen={};var pool=[];wrongs.forEach(function(w){w=String(w);if(w!==c&&!seen[w]){seen[w]=1;pool.push(w)}});['无法确定','以上均不符合','保持不变','缺少条件'].forEach(function(x){if(pool.length<3&&x!==c&&!seen[x]){seen[x]=1;pool.push(x)}});pool=shuffle(pool,seed).slice(0,3);var target=(seed*7+3)%4,opts=[],k=0;for(var i=0;i<4;i++){opts[i]=(i===target)?c:pool[k++]}return {opts:opts,ans:target}}
function fmtPct(r){return (Math.round(r*1000)/10).toFixed(1).replace('.0','')+'%'}
function hearts(n){var s='';for(var i=0;i<3;i++)s+=i<n?'❤️':'🖤';return s}
function renderHome(){stopPoll();state={room:null,role:null,answered:false,currentQ:null};app.innerHTML='<div class="grid"><div class="card"><span class="badge">🏠 创建房间</span><p>创建后把6位房间码发给朋友。</p><input id="hostName" placeholder="你的昵称，比如：凤雏" maxlength="10"><button class="main" onclick="createRoom()">创建好友房</button><p class="small">每局20题，每人3颗心。答对+10分，答错扣1心。</p></div><div class="card"><span class="badge">⚔️ 加入房间</span><p>输入朋友发来的6位房间码。</p><input id="guestName" placeholder="你的昵称" maxlength="10"><input id="roomCode" placeholder="房间码，例如 839201" maxlength="6"><button class="main" onclick="joinRoom()">加入对战</button><p class="small">PK模式禁用道具，公平对战。</p></div></div><div class="card" style="margin-top:12px"><span class="badge">📡 连接方式</span><p class="small">稳定版使用 fetch 轮询同步，不需要加载 Supabase JS 文件。如果这里能看到按钮，说明页面已经正常打开。</p></div>'}
async function createRoom(){try{var name=(document.getElementById('hostName').value||'房主').trim().slice(0,10);var id=String(Math.floor(100000+Math.random()*900000));var obj={id:id,status:'waiting',host_id:clientId,host_name:name,host_hp:3,guest_hp:3,host_score:0,guest_score:0,host_answered:false,guest_answered:false,current_question:0,question_seed:Math.floor(Math.random()*999999),last_event:'房间已创建'};var room=await apiInsert(obj);state.role='host';state.room=room;startPoll(id);renderWaiting(room)}catch(e){showError('创建失败：'+e.message+'。如果提示 battle_rooms 不存在，说明 SQL 表还没建好。')}}
async function joinRoom(){try{var name=(document.getElementById('guestName').value||'挑战者').trim().slice(0,10);var id=(document.getElementById('roomCode').value||'').trim();if(!/^\d{6}$/.test(id)){alert('请输入6位房间码');return}var room=await apiGetRoom(id);if(!room){alert('没找到这个房间');return}if(room.status!=='waiting'&&room.guest_id!==clientId){alert('这个房间已经开始或结束了');return}room=await apiPatch(id,{guest_id:clientId,guest_name:name,status:'playing',last_event:name+' 加入了房间',updated_at:new Date().toISOString()});state.role='guest';state.room=room;startPoll(id);renderGame(room)}catch(e){showError('加入失败：'+e.message)}}
function startPoll(id){stopPoll();pollTimer=setInterval(async function(){try{var room=await apiGetRoom(id);if(room){state.room=room;if(room.status==='waiting')renderWaiting(room);else if(room.status==='playing')renderGame(room);else renderResult(room);maybeAdvance(room)}}catch(e){console.log(e)}},1400)}
function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}if(advanceTimer){clearTimeout(advanceTimer);advanceTimer=null}}
function renderWaiting(room){app.innerHTML='<div class="card" style="text-align:center"><span class="badge">等待好友加入</span><p>把这个房间码发给朋友：</p><div class="roomCode">'+room.id+'</div><p class="small">好友加入后自动开始。不要关闭页面。</p><button class="ghost" onclick="copyCode(\''+room.id+'\')">复制房间码</button> <button class="danger" onclick="renderHome()">返回首页</button></div>'}
function copyCode(code){if(navigator.clipboard)navigator.clipboard.writeText(code);alert('房间码：'+code)}
function playerStats(room){return '<div class="stats"><div class="player '+(state.role==='host'?'active':'')+'"><b>房主：'+escapeHtml(room.host_name||'房主')+'</b><br><span class="hp">'+hearts(room.host_hp)+'</span><br><span class="score">'+room.host_score+'</span> 分<div class="small">'+(room.host_answered?'已作答':'未作答')+'</div></div><div class="player '+(state.role==='guest'?'active':'')+'"><b>挑战者：'+escapeHtml(room.guest_name||'等待中')+'</b><br><span class="hp">'+hearts(room.guest_hp)+'</span><br><span class="score">'+room.guest_score+'</span> 分<div class="small">'+(room.guest_answered?'已作答':'未作答')+'</div></div></div>'}
function renderGame(room){state.room=room;state.answered=state.role==='host'?room.host_answered:room.guest_answered;var q=getQuestion(room.question_seed,room.current_question);state.currentQ=q;var opts='';q.opts.forEach(function(o,i){opts+='<button class="opt" '+(state.answered?'disabled':'')+' onclick="answer('+i+')"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></button>'});app.innerHTML=playerStats(room)+'<div class="card"><span class="badge">第 '+(room.current_question+1)+'/20 题 · '+q.type+'</span>'+(q.material?'<div class="material">'+q.material+'</div>':'')+'<div class="q">'+q.q+'</div><div class="opts">'+opts+'</div><div id="fb" class="feedback '+(state.answered?'good':'')+'">'+(state.answered?'你已作答，等待对方或自动进入下一题。':'')+'</div></div><div class="card" style="margin-top:12px"><span class="badge">📡 房间状态</span><p class="small">'+escapeHtml(room.last_event||'对战中')+'</p><button class="ghost" onclick="renderHome()">退出到首页</button></div>'}
async function answer(choice){try{var room=state.room,q=state.currentQ;if(!room||state.answered)return;var correct=choice===q.ans;var patch={updated_at:new Date().toISOString()};if(state.role==='host'){patch.host_answered=true;patch.host_score=room.host_score+(correct?10:0);patch.host_hp=Math.max(0,room.host_hp-(correct?0:1));patch.last_event=(room.host_name||'房主')+(correct?' 答对了':' 答错了')}else{patch.guest_answered=true;patch.guest_score=room.guest_score+(correct?10:0);patch.guest_hp=Math.max(0,room.guest_hp-(correct?0:1));patch.last_event=(room.guest_name||'挑战者')+(correct?' 答对了':' 答错了')}var buttons=document.querySelectorAll('.opt');for(var k=0;k<buttons.length;k++){buttons[k].disabled=true;if(k===q.ans)buttons[k].classList.add('correct');if(k===choice&&choice!==q.ans)buttons[k].classList.add('wrong')}var fb=document.getElementById('fb');fb.className='feedback '+(correct?'good':'bad');fb.innerHTML=(correct?'✅ 答对了，+10分。':'❌ 答错了，扣1颗心。')+'<br>正确答案：'+String.fromCharCode(65+q.ans)+'。<br><b>解析：</b>'+q.exp;if(correct) reward();if(patch.host_hp===0||patch.guest_hp===0){patch.status='finished';patch.winner=decideWinner(Object.assign({},room,patch))}await apiPatch(room.id,patch);state.answered=true}catch(e){showError('提交失败：'+e.message)}}
function maybeAdvance(room){if(!room||room.status!=='playing'||state.role!=='host')return;if(!(room.host_answered&&room.guest_answered))return;if(advanceTimer)return;advanceTimer=setTimeout(async function(){advanceTimer=null;try{var latest=await apiGetRoom(room.id);if(!latest||latest.status!=='playing'||!(latest.host_answered&&latest.guest_answered))return;if(latest.current_question>=19||latest.host_hp<=0||latest.guest_hp<=0){await apiPatch(latest.id,{status:'finished',winner:decideWinner(latest),last_event:'对战结束',updated_at:new Date().toISOString()})}else{await apiPatch(latest.id,{current_question:latest.current_question+1,host_answered:false,guest_answered:false,last_event:'进入下一题',updated_at:new Date().toISOString()})}}catch(e){console.log(e)}},1600)}
function decideWinner(room){if(room.host_hp>room.guest_hp)return 'host';if(room.guest_hp>room.host_hp)return 'guest';if(room.host_score>room.guest_score)return 'host';if(room.guest_score>room.host_score)return 'guest';return 'draw'}
function renderResult(room){var txt=room.winner==='draw'?'平局':(room.winner===state.role?'你赢了':'你输了');app.innerHTML=playerStats(room)+'<div class="card" style="text-align:center"><div style="font-size:70px">'+(room.winner==='draw'?'🤝':(room.winner===state.role?'🏆':'💀'))+'</div><h2>'+txt+'</h2><p>最终比分：'+escapeHtml(room.host_name||'房主')+' '+room.host_score+' : '+room.guest_score+' '+escapeHtml(room.guest_name||'挑战者')+'</p><button class="main" onclick="renderHome()">返回首页</button></div>'}
function svgShape(kind,fill,rot,dot){var f=fill?'#2563eb':'none', stroke='#111827';var body='';if(kind==='circle')body='<circle cx="36" cy="36" r="22" fill="'+f+'" stroke="'+stroke+'" stroke-width="5"/>';if(kind==='square')body='<rect x="16" y="16" width="40" height="40" rx="7" fill="'+f+'" stroke="'+stroke+'" stroke-width="5"/>';if(kind==='tri')body='<polygon points="36,10 62,58 10,58" fill="'+f+'" stroke="'+stroke+'" stroke-width="5"/>';if(kind==='diamond')body='<polygon points="36,8 64,36 36,64 8,36" fill="'+f+'" stroke="'+stroke+'" stroke-width="5"/>';if(kind==='arrow')body='<path d="M36 8 L58 36 H44 V64 H28 V36 H14 Z" fill="'+(fill?'#7c3aed':'#fff')+'" stroke="'+stroke+'" stroke-width="4"/>';var d=dot?'<circle cx="51" cy="21" r="6" fill="#f59e0b"/>':'';return '<svg viewBox="0 0 72 72" style="transform:rotate('+rot+'deg)">'+body+d+'</svg>'}
function figGrid(cells){return '<div class="figGrid">'+cells.map(function(x){return '<div class="figCell">'+(x||'?')+'</div>'}).join('')+'</div>'}
function getQuestion(seed,idx){var mod=idx%5;if(mod===0)return graphQuestion(seed,idx);if(mod===1)return dataQuestion(seed,idx);if(mod===2)return verbalQuestion(seed,idx);if(mod===3)return logicQuestion(seed,idx);return commonQuestion(seed,idx)}
function graphQuestion(seed,idx){var id=seed+idx*31,t=idx%4;if(t===0){var shapes=['circle','square','tri','diamond'],fills=[false,true,false,true,false,true];var kind=pick(shapes,id),cells=[];for(var i=0;i<8;i++)cells.push(svgShape(kind,fills[i],i*45,i%3===0));cells.push('');var correct=svgShape(kind,fills[2],0,true);var p=makeOptions(correct,[svgShape(kind,!fills[2],0,false),svgShape(pick(shapes,id+1),true,90,true),svgShape(kind,true,180,false)],id);return Object.assign({type:'图形推理',material:figGrid(cells),q:'九宫格图形按“填充状态、旋转角度、角点标记”复合变化。问号处应填入哪一项？',exp:'观察每格旋转角度逐步增加，同时填充与空心交替，角点标记按固定间隔出现。'},p)}if(t===1){var rots=[0,90,180,270,0,90];var seq=rots.slice(0,5).map(function(r){return svgShape('arrow',idx%2===0,r,true)});var correct=svgShape('arrow',idx%2===0,rots[5],true);var p=makeOptions(correct,[svgShape('arrow',idx%2===0,180,true),svgShape('arrow',idx%2!==0,90,false),svgShape('arrow',idx%2===0,270,false)],id);return Object.assign({type:'图形推理',material:'<div class="row">'+seq.map(function(x){return '<div class="figCell">'+x+'</div>'}).join('')+'<div class="figCell">?</div></div>',q:'观察箭头方向与标记位置的循环规律，下一图应为：',exp:'箭头按90°顺时针旋转，角点标记保持同类规则。'},p)}var correct=svgShape('tri',false,180,false);var p=makeOptions(correct,[svgShape('tri',true,180,false),svgShape('diamond',false,180,true),svgShape('square',true,180,false)],id);return Object.assign({type:'图形推理',material:'<div class="row"><div class="figCell">'+svgShape('diamond',false,0,false)+'</div><div class="figCell">'+svgShape('diamond',true,45,false)+'</div><div class="figCell">'+svgShape('square',false,90,true)+'</div><div class="figCell">'+svgShape('square',true,135,true)+'</div><div class="figCell">?</div></div>',q:'该组图形的外形、填充、旋转角度呈分组递进关系，下一项应为：',exp:'每两项为一组，外形进入下一组，旋转角度继续递增，填充重新开始。'},p)}
function dataQuestion(seed,idx){var id=seed+idx*19;var a=1200+(id%9)*137,b=1450+(id%7)*163,c=980+(id%6)*151;var a2=Math.round(a*(1.08+(idx%4)*0.017)),b2=Math.round(b*(1.05+(idx%5)*0.014)),c2=Math.round(c*(1.11+(idx%3)*0.021));var rows=[['A类岗位',a,a2],['B类岗位',b,b2],['C类岗位',c,c2]];var total1=a+b+c,total2=a2+b2+c2,inc=total2-total1;var table='<table><tr><th>类别</th><th>去年报名</th><th>今年报名</th></tr>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'}).join('')+'<tr><th>合计</th><th>'+total1+'</th><th>'+total2+'</th></tr></table>';if(idx%3===0){var correct=fmtPct(inc/total1),p=makeOptions(correct,[fmtPct(inc/total2),fmtPct((inc+80)/total1),fmtPct((a2-a)/a)],id);return Object.assign({type:'资料分析',material:table,q:'今年三类岗位报名总人数较去年约增长多少？',exp:'增长率=增长量÷基期量=('+total2+'-'+total1+')÷'+total1+'≈'+correct+'。'},p)}var target=rows[idx%3],correct2=target[2]-target[1],p2=makeOptions(correct2+'人',[inc+'人',(correct2+50)+'人',Math.abs(rows[(idx+1)%3][2]-rows[(idx+1)%3][1])+'人'],id);return Object.assign({type:'资料分析',material:table,q:target[0]+'今年比去年多报名多少人？',exp:'增量=今年-去年='+target[2]+'-'+target[1]+'='+correct2+'人。'},p2)}
function verbalQuestion(seed,idx){var qs=[['某些政策文本看似措辞温和，实则在限定条件中设置了严格边界。理解这类材料，关键不是逐字复述，而是把握条件之间的____。','约束关系',['修辞色彩','字形结构','偶然联系'],'句子强调限定条件与边界，应选“约束关系”。'],['在信息过载的环境中，判断观点是否成立，不能只看结论是否醒目，更要审查论据能否____结论。','支撑',['装饰','替换','回避'],'论据与结论之间需要支撑关系。'],['真正有效的复盘，既要发现错误结果，也要追问错误产生的路径，否则容易把复杂问题____为粗心。','简化',['扩展','美化','并列'],'把复杂问题归因为粗心，是不恰当的简化。']];var v=qs[idx%qs.length],p=makeOptions(v[1],v[2],seed+idx);return Object.assign({type:'言语理解',material:'',q:v[0],exp:v[3]},p)}
function logicQuestion(seed,idx){var qs=[['某单位规定：只有完成资格审核，才能进入面试。小赵没有进入面试。下列一定能推出的是：','不能确定小赵是否完成资格审核',['小赵一定没有完成资格审核','小赵一定完成了资格审核','完成资格审核的人都能进入面试'],'“进入面试→完成审核”。否定前件不能推出否定后件，所以不能确定。'],['如果加强训练，则正确率提高；只有正确率提高，才可能进入下一轮。若不能进入下一轮，下列判断最稳妥的是：','不能必然推出没有加强训练',['一定没有加强训练','一定加强训练了','正确率一定没有提高'],'不能进入下一轮不能必然否定正确率提高，更不能必然推出训练情况。']];var v=qs[idx%qs.length],p=makeOptions(v[1],v[2],seed+idx*3);return Object.assign({type:'逻辑判断',material:'',q:v[0],exp:v[3]},p)}
function commonQuestion(seed,idx){var qs=[['事业单位工作人员处理群众诉求时，较优先体现的是：','依法依规与公共服务意识',['个人偏好优先','结果可以不留痕','只追求形式完整'],'事业单位岗位强调依法履职、规范服务和公共责任。'],['公文办理中，最不宜出现的是：','未经核实即对外发布重要信息',['按流程送审','明确责任部门','留存办理记录'],'重要信息发布需核实并按程序审批。']];var v=qs[idx%qs.length],p=makeOptions(v[1],v[2],seed+idx*5);return Object.assign({type:'常识判断',material:'',q:v[0],exp:v[3]},p)}
function reward(){var t=document.getElementById('toast'),tt=document.getElementById('toastText');tt.innerHTML='答对了！+10';t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1000)}
window.onerror=function(msg,src,line,col,err){showError('页面脚本错误：'+msg+' 第'+line+'行')};
renderHome();
